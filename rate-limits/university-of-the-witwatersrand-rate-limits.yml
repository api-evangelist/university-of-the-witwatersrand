created: '2026-06-03'
modified: '2026-08-30'
reconciled: false
tags:
- Education
- Higher Education
- University
- Rate Limiting
description: >-
  University of the Witwatersrand publishes no rate-limit table. The two surfaces it operates —
  the WIReDSpace DSpace 9.2 REST API and the WIReDSpace OAI-PMH 2.0 endpoint — returned no
  RateLimit or X-RateLimit headers and no 429 on probing, and neither documents a published
  ceiling. OAI-PMH harvesting is resumption-token paced by protocol. Clients should harvest
  politely, honor Retry-After, and contact the Wits Library open scholarship team
  (openscholarship.library@wits.ac.za) for bulk access.
notes: Confirm per-service limits with each API's documentation; harvest responsibly.
sources:
- https://raw.githubusercontent.com/api-evangelist/university-of-the-witwatersrand/refs/heads/main/apis.yml
responseCodes:
  throttled: 429
limits:
- name: Default
  scope: client
  metric: requests-per-minute
  limit: see service documentation
  notes: No published global limit; large harvests may be rate-limited.
policies:
- name: Backoff Strategy
  description: Exponential backoff with jitter; honor Retry-After; harvest during off-peak hours.
maintainers:
- FN: Kin Lane
