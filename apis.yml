description: >-
  The University of the Witwatersrand (Wits) is a public research university in Johannesburg, South
  Africa (ROR 03rp50x72). Wits operates no central developer portal and no student, timetable or
  registrar API. What it does operate, on its own domain and its own infrastructure, is WIReDSpace —
  the institutional repository running DSpace 9.2 — which exposes a HAL/JSON REST API and a complete
  OAI-PMH 2.0 harvesting interface advertising thirteen metadata formats, both answering anonymous
  callers. It also runs its own SAML 2.0 identity provider, registered in SAFIRE (the South African
  Identity Federation) and published to eduGAIN, which serves signed metadata as
  application/samlmetadata+xml — a genuine machine-readable institutional surface that is almost
  never catalogued as one. Its research data repository, the Wits Open Data Vault at
  opendata.wits.ac.za, is a Figshare tenant: the hostname is the university's and the 214 DOIs under
  the Wits DataCite prefix 10.71796 are the university's, but the API contract underneath is
  Figshare's and is catalogued against Figshare, not against Wits. Everything else in the estate —
  library discovery, LibGuides, the LMS, student self-service — is vendor software behind
  authentication. This profile was corrected on 2026-08-30: it previously credited Wits with the
  generic Figshare v2 API and nine of its tag splits, which were the vendor's engineering, not the
  university's.
