- aid: university-of-the-witwatersrand:university-of-the-witwatersrand-open-data-vault
  name: Wits Open Data Vault (Figshare tenant)
  x-operator: tenant
  x-vendor: Figshare
  description: >-
    The Wits research data repository. The hostname opendata.wits.ac.za is the university's and
    CNAMEs to proxy-eu-01.figshare.com; the DOIs are minted under the Wits DataCite prefix 10.71796
    through DataCite repository client wits.figshare (214 DOIs as of 2026-08-30). The repository,
    the data and the DOI membership are Wits institutional facts. The API contract that serves them
    is Figshare's generic v2 API, shared by every Figshare customer, so no OpenAPI is carried here —
    the contract is catalogued against Figshare. The portal answers automated fetches with an AWS WAF
    challenge (HTTP 202), so it is live but not machine-readable to an anonymous agent.
  humanURL: https://opendata.wits.ac.za/
  baseURL: https://opendata.wits.ac.za/
