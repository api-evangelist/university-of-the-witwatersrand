  - aid: university-of-the-witwatersrand:open-data-vault
    name: Wits Open Data Vault (Figshare)
    description: >-
      The Wits Open Data Vault is the university's research data repository,
      launched in 2025 on the Figshare platform and integrated with Altmetric and
