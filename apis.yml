  detail: >-
    Wits operates two real institution-owned machine-readable surfaces and both were probed live and
    catalogued: the WIReDSpace DSpace 9.2 REST API and the WIReDSpace OAI-PMH 2.0 interface, on
    wiredspace.wits.ac.za. A third, its SAFIRE-registered SAML identity provider at idp.wits.ac.za,
    is recorded as an IdentityFederation pointer and a conformance record. Beyond those the footprint
    is genuinely thin and that is the correct reading, not a gap in the sweep: no api.wits.ac.za and
    no data.wits.ac.za exist (NXDOMAIN), the course finder is HTML with no machine-readable backing,
    student self-service returns 401, and the research data repository is a Figshare tenant whose
    contract belongs to Figshare. The Wits Open Data Vault portal itself answers automated fetches
    with an AWS WAF challenge (HTTP 202, x-amzn-waf-action: challenge), so the tenant relationship is
    evidenced through DNS and DataCite rather than through the portal body.
