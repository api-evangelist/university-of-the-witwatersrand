---
aid: university-of-the-witwatersrand
name: University of the Witwatersrand
description: >-
  The University of the Witwatersrand (Wits) is a leading public research
  university in Johannesburg, South Africa, ranked #268 in the QS World
  University Rankings 2025. Wits does not operate a central, branded developer
  portal, but it exposes standards-based machine-readable interfaces through its
  library and open-research infrastructure. The most clearly public surfaces are
  the WIReDSpace institutional repository (DSpace 9.2), which offers both a REST
  API and an OAI-PMH metadata harvesting endpoint, and the Wits Open Data Vault,
  a Figshare-powered research data repository carrying DOIs for datasets. Other
  systems (Springshare LibGuides/LibCal, identity/SSO, and student services) are
  vendor-hosted and generally gated rather than openly documented.
